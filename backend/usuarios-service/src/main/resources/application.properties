# Nombre de la aplicación o microservicio
spring.application.name=usuarios-service

# Puerto HTTP del servicio cuando se ejecuta en local
server.port=${SERVER_PORT:8081}

# Niveles de registro y colores de consola
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
spring.output.ansi.enabled=always

# Lee las variables del archivo .env al arrancar desde la carpeta del servicio
spring.config.import=optional:file:./.env[.properties]

# Conexión JDBC a PostgreSQL, local o en Supabase
spring.datasource.url=${USUARIOS_DB_URL}
spring.datasource.username=${USUARIOS_DB_USER}
spring.datasource.password=${USUARIOS_DB_PASSWORD}
spring.datasource.driver-class-name=${USUARIOS_DB_DRIVER:org.postgresql.Driver}

# Flyway se encarga de ejecutar las migraciones SQL
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Hibernate valida el esquema y muestra las consultas con formato
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${USUARIOS_DB_SCHEMA:db_usuarios}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Esquema y carpeta de migraciones de Flyway
spring.flyway.enabled=true
spring.flyway.default-schema=${USUARIOS_DB_SCHEMA:db_usuarios}
spring.flyway.schemas=${USUARIOS_DB_SCHEMA:db_usuarios}
spring.flyway.locations=classpath:db/migration

# Swagger y OpenAPI se configuran en application.yaml.
