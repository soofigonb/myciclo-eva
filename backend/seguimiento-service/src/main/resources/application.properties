# Nombre de la aplicación o microservicio
spring.application.name=seguimiento-service

# Puerto HTTP del servicio cuando se ejecuta en local
server.port=${SERVER_PORT:8082}

# Niveles de registro y colores de consola
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
spring.output.ansi.enabled=always

# Lee las variables del archivo .env al arrancar desde la carpeta del servicio
spring.config.import=optional:file:./.env[.properties]

# Conexión JDBC a PostgreSQL, local o en Supabase
spring.datasource.url=${SEGUIMIENTO_DB_URL}
spring.datasource.username=${SEGUIMIENTO_DB_USER}
spring.datasource.password=${SEGUIMIENTO_DB_PASSWORD}
spring.datasource.driver-class-name=${SEGUIMIENTO_DB_DRIVER:org.postgresql.Driver}

# Flyway se encarga de ejecutar las migraciones SQL
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Hibernate valida el esquema y muestra las consultas con formato
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${SEGUIMIENTO_DB_SCHEMA:db_seguimiento}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Esquema y carpeta de migraciones de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=${SEGUIMIENTO_DB_SCHEMA:db_seguimiento}
spring.flyway.schemas=${SEGUIMIENTO_DB_SCHEMA:db_seguimiento}
spring.flyway.locations=classpath:db/migration

# Configuración de tokens JWT (compatible con usuarios-service)
app.jwt.secret=${JWT_SECRET:myciclo-eva-secret-key-super-segura-2026-min-256-bits!}
app.jwt.issuer=${JWT_ISSUER:myciclo-eva-usuarios}
app.jwt.audience=${JWT_AUDIENCE:myciclo-eva-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Swagger y OpenAPI se configuran en application.yaml.
